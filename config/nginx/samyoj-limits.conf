# Installed on the box as /etc/nginx/conf.d/samyoj-limits.conf (http context).
limit_req_zone $binary_remote_addr zone=samyoj_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=samyoj_hook:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=samyoj_web:10m rate=40r/s;
limit_req_status 429;
server_tokens off;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
