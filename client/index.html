<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&family=Poppins:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Samyoj</title>
    <script>
      (function () {
        var key = 'wa-theme';
        var stored = localStorage.getItem(key);
        var path = location.pathname;
        var authLight =
          path === '/login' ||
          path.indexOf('/register') === 0 ||
          path.indexOf('/forgot-password') === 0 ||
          path.indexOf('/reset-password') === 0 ||
          path.indexOf('/verify-email') === 0 ||
          path.indexOf('/invite') === 0;
        var dark = !authLight && stored === 'dark';
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';

        var densityKey = 'samyoj:density:v1';
        var density = localStorage.getItem(densityKey);
        document.documentElement.dataset.density =
          density === 'compact' ? 'compact' : 'comfortable';

        var textSizeKey = 'samyoj:text-size:v1';
        var textSize = localStorage.getItem(textSizeKey);
        var rootPx = textSize === 'small' ? '14px' : textSize === 'large' ? '18px' : '16px';
        document.documentElement.dataset.textSize =
          textSize === 'small' || textSize === 'large' ? textSize : 'default';
        document.documentElement.style.setProperty('--app-root-font-size', rootPx);

        var fontKey = 'samyoj:font-family:v1';
        var fontId = localStorage.getItem(fontKey) || 'jakarta';
        var fontStacks = {
          jakarta: '"Plus Jakarta Sans", system-ui, sans-serif',
          inter: 'Inter, system-ui, sans-serif',
          geist: 'Geist, system-ui, sans-serif',
          'ibm-plex': '"IBM Plex Sans", system-ui, sans-serif',
          'source-sans': '"Source Sans 3", system-ui, sans-serif',
          roboto: 'Roboto, system-ui, sans-serif',
          'public-sans': '"Public Sans", system-ui, sans-serif',
          figtree: 'Figtree, system-ui, sans-serif',
          noto: '"Noto Sans", system-ui, sans-serif',
          atkinson: '"Atkinson Hyperlegible", system-ui, sans-serif',
          system: 'system-ui, -apple-system, "Segoe UI", sans-serif',
        };
        var fontHrefs = {
          inter: 'https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap',
          geist: 'https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap',
          'ibm-plex': 'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap',
          'source-sans': 'https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap',
          roboto: 'https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap',
          'public-sans': 'https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap',
          figtree: 'https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap',
          noto: 'https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap',
          atkinson: 'https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap',
        };
        var stack = fontStacks[fontId] || fontStacks.jakarta;
        document.documentElement.dataset.fontFamily = fontStacks[fontId] ? fontId : 'jakarta';
        document.documentElement.style.setProperty('--app-font-family', stack);
        var href = fontHrefs[fontId];
        if (href) {
          var fontLink = document.createElement('link');
          fontLink.id = 'samyoj-app-font';
          fontLink.rel = 'stylesheet';
          fontLink.href = href;
          document.head.appendChild(fontLink);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
